<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="400" fill="#ffffff"/>
  <!-- stage panels -->
  <rect x="140" y="8" width="470" height="352" fill="#c9d8f0"/>
  <rect x="610" y="8" width="452" height="352" fill="#fdf4e8"/>

  <!-- input boxes -->
  <g fill="#2e63ad">
    <rect x="15" y="48" width="110" height="44"/>
    <rect x="15" y="158" width="110" height="44"/>
    <rect x="15" y="278" width="110" height="44"/>
  </g>
  <g fill="#ffffff" font-size="18" text-anchor="middle">
    <text x="70" y="76">512×512</text>
    <text x="70" y="186">256×256</text>
    <text x="70" y="306">128×128</text>
  </g>

  <!-- stage A blocks -->
  <g fill="#ececec" stroke="#c9c9c9">
    <rect x="175" y="158" width="160" height="44"/>
    <rect x="175" y="278" width="160" height="44"/>
    <polygon points="400,135 505,135 555,190 505,245 400,245"/>
  </g>
  <g fill="#1a1a1a" font-size="18" text-anchor="middle">
    <text x="255" y="186">Sensing</text>
    <text x="255" y="306" font-size="16">Reconstruction.A</text>
    <text x="462" y="201" font-size="30">+</text>
  </g>

  <!-- stage B blocks -->
  <g fill="#ececec" stroke="#c9c9c9">
    <rect x="640" y="48" width="160" height="44"/>
    <rect x="630" y="168" width="170" height="44"/>
    <polygon points="880,135 985,135 1035,190 985,245 880,245"/>
  </g>
  <g fill="#1a1a1a" font-size="18" text-anchor="middle">
    <text x="720" y="76">Sensing</text>
    <text x="715" y="196" font-size="16">Reconstruction.B</text>
    <text x="942" y="201" font-size="30">+</text>
  </g>

  <!-- output box -->
  <rect x="1080" y="168" width="110" height="44" fill="#2e63ad"/>
  <text x="1135" y="196" fill="#ffffff" font-size="18" text-anchor="middle">512×512</text>

  <!-- arrows -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <!-- inputs -->
    <line x1="125" y1="300" x2="171" y2="300" marker-end="url(#arrow)"/>
    <line x1="125" y1="180" x2="171" y2="180" marker-end="url(#arrow)"/>
    <line x1="125" y1="70" x2="636" y2="70" marker-end="url(#arrow)"/>
    <!-- stage A -->
    <line x1="255" y1="278" x2="255" y2="206" marker-end="url(#arrow)"/>
    <line x1="335" y1="172" x2="396" y2="172" marker-end="url(#arrow)"/>
    <polyline points="335,300 370,300 370,208 396,208" marker-end="url(#arrow)"/>
    <line x1="555" y1="190" x2="626" y2="190" marker-end="url(#arrow)"/>
    <!-- stage B -->
    <line x1="715" y1="168" x2="715" y2="96" marker-end="url(#arrow)"/>
    <polyline points="800,70 910,70 910,131" marker-end="url(#arrow)"/>
    <line x1="800" y1="190" x2="876" y2="190" marker-end="url(#arrow)"/>
    <line x1="1035" y1="190" x2="1076" y2="190" marker-end="url(#arrow)"/>
  </g>

  <!-- captions -->
  <g fill="#333333" font-size="20" text-anchor="middle">
    <text x="375" y="388">(a) 128 → 256</text>
    <text x="836" y="388">(b) 256 → 512</text>
  </g>
</svg>
